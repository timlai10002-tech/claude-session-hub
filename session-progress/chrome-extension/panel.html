<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Session Hub</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f6f4; color: #1d1d1b; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #161615; color: #ececea; } }
  iframe { border: 0; width: 100%; height: 100%; display: none; }
  #down { display: none; padding: 24px 18px; }
  #down code { background: rgba(127,127,127,.18); padding: 1px 6px; border-radius: 4px; }
  #down p { margin: 0 0 10px; }
  .dim { opacity: .65; font-size: 12px; }
</style>
</head>
<body>
<iframe id="view" title="Claude Session Hub"></iframe>
<div id="down">
  <p><b>The local server isn't running</b></p>
  <p>Run <code>/sessions-web</code> in any Claude Code session to start it.</p>
  <p class="dim">Retrying every 3 seconds…</p>
</div>
<script src="panel.js"></script>
</body>
</html>
